<html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WALL-E · Atlas Console</title>
<style>
:root{color-scheme:dark;--bg:#0c1220;--card:#141f31;--line:#29374d;--muted:#a0afc4;--text:#edf3fa;--accent:#53d8b7;--warn:#ffc56b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.7 Tahoma,Arial,sans-serif}button,input,select{font:inherit;color:inherit}button,select{cursor:pointer;background:#1d2c42;border:1px solid var(--line);border-radius:10px;padding:9px 14px}button:hover,button.active{border-color:var(--accent);color:var(--accent)}aside{position:fixed;inset-block:0;inset-inline-start:0;width:240px;padding:28px 20px;border-inline-end:1px solid var(--line);background:#101929}main{margin-inline-start:240px;padding:30px;max-width:1650px}.brand{font:700 28px/1.4 Arial;letter-spacing:3px;color:var(--accent)}.muted{color:var(--muted);font-size:12px}nav{display:grid;gap:9px;margin-top:35px}nav button{text-align:start;border-color:transparent;background:transparent}header{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:24px}h1{margin:0;font-size:26px}h2{font-size:17px;margin:0 0 18px}h3{font-size:14px}.badge{display:inline-block;border:1px solid #52725f;border-radius:30px;padding:4px 12px;color:var(--accent);font:12px/1.8 monospace}.warning{color:var(--warn);border:1px solid #705737;background:#30291f;border-radius:14px;padding:14px 18px;margin:20px 0}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;min-width:0;margin-bottom:18px}.value{font:600 25px/1.8 Arial;overflow-wrap:anywhere}.two{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}input{background:#0d1726;border:1px solid var(--line);border-radius:10px;padding:12px;width:min(100%,550px)}table{width:100%;border-collapse:collapse;text-align:start;font-size:12px}th,td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top;max-width:350px;overflow-wrap:anywhere}th{color:var(--muted);font-weight:400}.scroll{overflow:auto}canvas{width:100%;height:300px;display:block}pre,code{direction:ltr;text-align:left;font:12px/1.7 Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere}pre{background:#0a1321;padding:16px;border-radius:12px;max-height:540px;overflow:auto}details{border-bottom:1px solid var(--line);padding:12px 0}summary{cursor:pointer}section[hidden]{display:none}.empty{color:var(--muted);padding:28px;text-align:center;border:1px dashed var(--line);border-radius:12px}.tool{margin:12px 0;padding:16px;background:var(--card);border:1px solid var(--line);border-radius:12px}.tool code{display:block;color:var(--accent);margin:9px 0}a{color:var(--accent)}footer{color:var(--muted);font-size:11px;padding:20px 0}.tabrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.page-tag{font:11px monospace;color:var(--muted);letter-spacing:2px}.wide{grid-column:span 2}.error{color:#ff9f9f}@media(max-width:1050px){.grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}@media(max-width:700px){aside{position:static;width:auto;padding:16px;border-inline-end:0}nav{display:flex;overflow:auto;margin-top:15px}nav button{white-space:nowrap}main{margin:0;padding:16px}header{align-items:start}.grid{gap:10px}.card{padding:16px}.value{font-size:21px}h1{font-size:21px}}
</style>
<aside><div class="brand" dir="ltr">WALL-E<span style="color:#8496b0"> /</span></div><div class="muted">Wallex Atlas · Evidence Console</div><nav id="nav"></nav><div style="margin-top:40px"><span class="badge">READ_ONLY</span><p class="muted" data-fa="کلید و سفارش در این رابط وارد نمی‌شود." data-en="No credentials or order entry in this console."></p></div></aside>
<main><header><div><div class="page-tag">RESEARCH / OPERATIONS</div><h1 id="heading"></h1><div id="clock" class="muted"></div></div><div class="toolbar"><button id="language">English</button><button id="refresh" data-fa="تازه‌سازی" data-en="Refresh"></button></div></header><div id="notice" class="warning"></div>
<section id="overview"><div class="grid" id="metrics"></div><div class="two"><article class="card"><h2 data-fa="موعد و مرز اختیار" data-en="Deadline & authority"></h2><div id="deadline"></div></article><article class="card"><h2 data-fa="وضعیت واقعی شواهد" data-en="Actual evidence status"></h2><div id="health"></div></article></div><article class="card"><h2 data-fa="آخرین تصمیم‌ها" data-en="Latest decisions"></h2><div id="latest" class="scroll"></div></article></section>
<section id="markets" hidden><div class="toolbar"><label for="symbol" data-fa="بازار" data-en="Market"></label><select id="symbol"><option>BTCTMN</option><option>ETHTMN</option></select><select id="resolution" aria-label="Timeframe"><option value="1">1m</option><option value="5">5m</option><option value="15" selected>15m</option><option value="30">30m</option><option value="60">1h</option><option value="240">4h</option><option value="1D">1D</option></select></div><article class="card"><h2 data-fa="کندل بسته و هش‌تأییدشده" data-en="Closed, hash-verified candles"></h2><canvas id="candles" aria-label="Actual candle chart"></canvas><div id="chartnote" class="muted"></div></article><article class="card"><h2>Ichimoku · Fibonacci · SuperTrend · Features</h2><div id="technical"></div></article></section>

<section id="evidence" hidden><div class="tabrow" id="evidencetabs"></div><div id="evidencebody"></div></section>
<section id="tools" hidden><article class="card"><h2 data-fa="همه ابزارها، بدون شلوغی" data-en="All tools, one searchable catalog"></h2><p class="muted" data-fa="فرمان واقعی را کپی کنید و ابتدا راهنما را بخوانید. این فهرست shell یا مجوز معامله نیست." data-en="Copy actual commands and inspect help. This catalog is not a shell or trade permission."></p><input id="search" type="search" aria-label="Search tool catalog" placeholder="Search / جست‌وجوی ابزار"><span id="toolcount" class="muted"></span></article><div id="toolitems"></div></section>
<footer data-fa="فقط اطلاعات ذخیره‌شدهٔ واقعی · Paper با Real یکی نیست · برتری اقتصادی تأیید نشده · فروش کامل تضمین نمی‌شود" data-en="Actual saved evidence only · Paper is not Real · No verified economic edge · Settlement is not guaranteed"></footer></main>
<script>
'use strict';const $=id=>document.getElementById(id),esc=s=>String(s??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),num=n=>n==null?'—':Number(n).toLocaleString('en-US',{maximumFractionDigits:2});let lang='fa',current='overview',snapshot=null,toolset=[],lastExport=null;
const pages={overview:['نمای کلی','Overview'],markets:['بازار و تکنیکال','Markets & Technical'],ai:['پژوهش هوش مصنوعی','AI Research'],portfolio:['پرتفوی و سفارش','Portfolio & Orders'],evidence:['شواهد و عملیات','Evidence & Operations'],tools:['فهرست ابزارها','Tool Catalog']};const t=(fa,en)=>lang==='fa'?fa:en;
async function get(path){const r=await fetch(path,{cache:'no-store'});const v=await r.json();if(!r.ok)throw Error(v.status||v.error||r.status);return v}
const pretty=x=>`<pre>${esc(JSON.stringify(x,null,2))}</pre>`;const table=(rows,cols)=>rows.length?`<div class="scroll"><table><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${esc(typeof r[c]==='object'?JSON.stringify(r[c]):r[c])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:`<div class="empty">DATA_NOT_AVAILABLE</div>`;
function card(title,value,foot){return `<article class="card"><div class="muted">${esc(title)}</div><div class="value">${esc(value)}</div><div class="muted">${esc(foot)}</div></article>`}
function technicalCard(d){if(!d)return '<div class="empty">DATA_NOT_AVAILABLE</div>';let i=d.ichimoku||{},s=d.supertrend_trailing_band_v1||{},f=d.fibonacci||{};return table([{Tenkan9:i.tenkan9,Kijun26:i.kijun26,SuperTrend:s.direction,ATR14:s.atr14,Fibonacci:f.status}],['Tenkan9','Kijun26','SuperTrend','ATR14','Fibonacci'])+`<p class="muted">${esc(d.status)} · descriptive evidence, not guaranteed return</p><details><summary>Feature/PIT registry and full evidence</summary>${pretty(d)}</details>`}
function locale(){document.documentElement.lang=lang;document.documentElement.dir=lang==='fa'?'rtl':'ltr';document.querySelectorAll('[data-fa]').forEach(e=>e.textContent=e.dataset[lang]);$('language').textContent=lang==='fa'?'English':'فارسی';$('nav').innerHTML=Object.entries(pages).map(([k,v])=>`<button data-page="${k}" class="${k===current?'active':''}">${esc(v[lang==='fa'?0:1])}</button>`).join('');$('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>open(b.dataset.page));$('heading').textContent=pages[current][lang==='fa'?0:1];$('notice').textContent=t('LIVE سخت غیرفعال است. اعداد حساب Shadow فرضی‌اند؛ حساب و اعتبار مسابقه تأیید نشده‌اند.','LIVE is HARD_DISABLED. Shadow funds are hypothetical; contest account and credit are not verified.')}
async function open(page){current=page;Object.keys(pages).forEach(p=>$(p).hidden=p!==page);locale();try{if(page==='markets')await market();if(page==='ai')await ai('forecasts');if(page==='evidence')await evidence('decisions');if(page==='tools')renderTools();}catch(e){$('notice').textContent='SOURCE_UNAVAILABLE · '+e.message}}
function render(){if(!snapshot)return;const o=snapshot.observations,p=o.paper||{},d=snapshot.deadline;const last=o.decisions[0];$('clock').textContent=snapshot.now_utc+' · '+d.now_tehran;
 $('metrics').innerHTML=card(t('حالت رابط','Console mode'),'READ_ONLY','LIVE HARD_DISABLED')+card(t('سرمایهٔ فرضی نقد','Hypothetical cash'),num(p.cash_tmn),'SHADOW / TMN')+card(t('پیش‌بینی ثبت‌شده','Saved forecasts'),o.forecasts.length,t('نتیجهٔ قدیمی با وضعیت مؤثر','Historical receipts / effective status'))+card(t('دارایی کاتالوگ','Catalog assets'),snapshot.catalog.assets,t('نه فهرست مجاز مسابقه','Not contest allowlist'));
 $('deadline').innerHTML=`<span class="badge">${esc(d.phase)}</span>${table([{entry_stop:d.entry_stop,unwind_start:d.unwind_start,halt:d.deadline_tehran}],['entry_stop','unwind_start','halt'])}<p class="muted">${esc(d.clock_status)}</p><p class="muted">${t('زمان‌بند فقط اجازه را قطع می‌کند، نه تضمین Fill.','The gate stops permission, not a guarantee of fills.')}</p>`;
 $('health').innerHTML=table([{session:o.session||'DATA_NOT_AVAILABLE',collector_lease:o.collector_lease_current?'ACTIVE_LEASE':'NO_ACTIVE_LEASE',real_balance:'NOT_VERIFIED',real_pnl:'NOT_AVAILABLE',network:snapshot.network}],['session','collector_lease','real_balance','real_pnl','network']);$('latest').innerHTML=table(o.decisions.slice(0,5),['symbol','action','reason','id']);
 $('capital').innerHTML=card('Shadow cash',num(p.cash_tmn),'TMN / hypothetical')+card('NAV at last saved receipt',last?num(last.nav_at_receipt):'—','NOT CURRENT MARK-TO-MARKET')+card('Real account NAV','NOT_VERIFIED','Contest credit unknown')+card('Realized exchange PnL','NOT_AVAILABLE','No verified exchange fills');$('positions').innerHTML=table(p.positions||[],['symbol','quantity','entry_cost'])+`<p class="muted">${t('صف سفارش واقعی تأیید نشده؛ نبود داده به معنی نبود سفارش نیست.','Real open orders not verified; missing data is not zero orders.')}</p>`;$('allocation').innerHTML=last?pretty(last.allocation):'<div class="empty">DATA_NOT_AVAILABLE</div>'}
async function load(){try{snapshot=await get('/api/overview');render();toolset=await get('/api/tools');if(current==='tools')renderTools()}catch(e){$('notice').textContent='DATA_NOT_AVAILABLE · '+e.message}}
function plot(bars){let c=$('candles'),w=c.parentElement.clientWidth-44,h=300,r=devicePixelRatio||1;c.width=w*r;c.height=h*r;let ctx=c.getContext('2d');ctx.scale(r,r);ctx.clearRect(0,0,w,h);if(!bars.length){ctx.fillStyle='#a0afc4';ctx.fillText('DATA_NOT_AVAILABLE',30,130);return}let min=Math.min(...bars.map(b=>b.low)),max=Math.max(...bars.map(b=>b.high));if(max===min){ctx.fillStyle='#a0afc4';ctx.fillText('NO_PRICE_RANGE',30,130);return}let y=v=>20+(max-v)/(max-min)*240,bw=(w-90)/bars.length;ctx.font='11px monospace';for(let i=0;i<=4;i++){let Y=20+i*60;ctx.strokeStyle='#29374d';ctx.beginPath();ctx.moveTo(5,Y);ctx.lineTo(w-75,Y);ctx.stroke();ctx.fillStyle='#a0afc4';ctx.fillText(num(max-i*(max-min)/4),w-70,Y+4)}bars.forEach((b,i)=>{let x=5+(i+.5)*bw;ctx.strokeStyle=ctx.fillStyle=b.close>=b.open?'#53d8b7':'#ef8585';ctx.beginPath();ctx.moveTo(x,y(b.high));ctx.lineTo(x,y(b.low));ctx.stroke();ctx.fillRect(x-Math.max(1,bw*.6)/2,Math.min(y(b.open),y(b.close)),Math.max(1,bw*.6),Math.max(1,Math.abs(y(b.open)-y(b.close))))});ctx.fillStyle='#a0afc4';ctx.fillText(new Date(bars[0].timestamp*1000).toISOString().slice(0,16),5,290);ctx.fillText(new Date(bars.at(-1).timestamp*1000).toISOString().slice(0,16),Math.max(5,w-230),290)}
async function market(){try{let p=await get('/api/candles?symbol='+encodeURIComponent($('symbol').value)+'&resolution='+$('resolution').value);plot(p.bars);$('chartnote').textContent=p.status+' · '+p.bars.length+' bars; gaps not filled';let d=snapshot?.observations.decisions.find(x=>x.symbol===$('symbol').value);$('technical').innerHTML=d?`<p class="muted">ARCHIVED DECISION EVIDENCE · ${esc(new Date(d.created*1000).toISOString())}</p>`+technicalCard(d.technical):'<div class="empty">DATA_NOT_AVAILABLE</div>'}catch(e){plot([]);$('chartnote').textContent=e.message}}
function tabs(id,items,fn,active){$(id).innerHTML=items.map(([key,label])=>`<button data-key="${key}" class="${key===active?'active':''}">${esc(label)}</button>`).join('');$(id).querySelectorAll('button').forEach(b=>b.onclick=()=>fn(b.dataset.key))}
async function ai(key){tabs('aitabs',[['forecasts','Quantiles'],['patterns','Patterns'],['news','News / FinBERT'],['memory','Memory']],ai,key);let html='';if(key==='forecasts')html=table(snapshot?.observations.forecasts||[],['model','symbol','quantiles','effective_status','prediction_id']);else if(key==='news'){const v=await get('/api/news');html=`<div class="warning">${esc(v.model_license)}</div>`+table(v.rows,['title','source','available_at','processing_status','article_id'])}else if(key==='patterns'){const v=await get('/api/report?name=patterns');let s=v.data?.current_receipt_aware_searches||[];html=`<div class="warning">ARCHIVED SNAPSHOT · RESEARCH ONLY · NOT PROVEN EDGE</div>`+s.map(x=>`<article class="card"><h2>${esc(x.window.symbol+' / '+x.similarity)}</h2>${table(x.matches.slice(0,8),['symbol','distance','start','end','available_at','pattern_id'])}<details><summary>Provenance / normalization / outcomes</summary>${pretty(x)}</details></article>`).join('');if(!s.length)html='<div class="empty">DATA_NOT_AVAILABLE</div>'}else{let m=snapshot?.observations.decisions[0]?.memory||[];html=pretty({status:m.length?'SAVED_PIT_MEMORY':'DATA_NOT_AVAILABLE',events:m})}$('aibody').innerHTML=html}
async function evidence(key){tabs('evidencetabs',[['decisions','Agent debates'],['replay','Replay / Backtest'],['sync','DataSync'],['shadow','Shadow'],['rubric','Judge'],['publish','Publish'],['readiness','Live readiness']],evidence,key);if(key==='decisions'){$('evidencebody').innerHTML=(snapshot?.observations.decisions||[]).map(d=>`<article class="card"><h2>${esc(d.symbol+' · '+d.action)}</h2><p>${esc(d.reason)}</p><code>${esc(d.id)}</code><details><summary>10 agents / debates / trace</summary>${pretty(d)}</details></article>`).join('')||'<div class="empty">DATA_NOT_AVAILABLE</div>';return}let v=await get('/api/report?name='+key);lastExport=v;$('evidencebody').innerHTML=`<article class="card"><div class="toolbar"><span class="badge">${esc(v.status)}</span><button id="export">Export public report JSON</button></div>${pretty(v.data)}</article>`;$('export').onclick=()=>{const blob=new Blob([JSON.stringify(lastExport,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='atlas-'+key+'.json';a.click();URL.revokeObjectURL(u)}}
function renderTools(){let q=$('search').value.toLowerCase(),items=toolset.filter(x=>JSON.stringify(x).toLowerCase().includes(q));$('toolcount').textContent=' '+items.length+' modules';$('toolitems').innerHTML=items.map((x,i)=>`<article class="tool"><b>${esc(x.module)}</b><div class="muted">${esc(x.description)}</div><code>${esc(x.command)}</code><button data-copy="${i}">${t('کپی فرمان','Copy command')}</button><details><summary>${t('فرمان‌ها و گزینه‌های کشف‌شده','Detected commands / choices')}</summary><pre>${esc(x.options_or_commands.join(' · '))}</pre></details></article>`).join('');$('toolitems').querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{navigator.clipboard.writeText(items[Number(b.dataset.copy)].command).then(()=>b.textContent='Copied').catch(()=>b.textContent='Select command above')})}
$('language').onclick=()=>{lang=lang==='fa'?'en':'fa';locale();render();open(current)};$('refresh').onclick=()=>load().then(()=>open(current));$('symbol').onchange=market;$('resolution').onchange=market;$('search').oninput=renderTools;window.addEventListener('resize',()=>{if(current==='markets')market()});locale();load();
</script>
<script>
// Archived, SHA-verified depth is visibly distinct from a fresh executable book.
new MutationObserver(()=>{let section=$('markets');if(section.hidden)return;let pane=$('bookpane');if(!pane){pane=document.createElement('article');pane.id='bookpane';pane.className='card';section.appendChild(pane)}let q=snapshot?.observations.quotes?.find(x=>x.symbol===$('symbol').value);pane.innerHTML='<h2>Order book · archived actual receipt</h2>'+(!q?.bid_top5?'<div class="empty">DATA_NOT_AVAILABLE</div>':`<p class="muted">${esc(q.status)} · ${esc(new Date(q.observed_epoch*1000).toISOString())}</p>${table(q.bid_top5.map((x,i)=>({bid_price:x[0],bid_quantity:x[1],ask_price:q.ask_top5[i]?.[0],ask_quantity:q.ask_top5[i]?.[1]})),['bid_price','bid_quantity','ask_price','ask_quantity'])}<code>${esc(q.receipt_sha256)}</code>`)}).observe($('technical'),{childList:true});
</script>
<script>
// Show only actual stored normalized pattern features, never invented examples.
new MutationObserver(async()=>{const active=document.querySelector('#aitabs button.active');if(active?.dataset.key!=='patterns'||$('pattern-lines'))return;let box=document.createElement('article');box.className='card';box.innerHTML='<h2>Normalized nearest neighbours · archived research</h2><canvas id="pattern-lines"></canvas><p class="muted">Window-only log-close / observed window volatility; not a price forecast.</p>';$('aibody').prepend(box);try{let r=await get('/api/pattern-lines'),cv=$('pattern-lines');if(!cv)return;let w=box.clientWidth-44,h=260,ratio=devicePixelRatio||1;cv.width=w*ratio;cv.height=h*ratio;let ctx=cv.getContext('2d');ctx.scale(ratio,ratio);if(!r.series.length){ctx.fillStyle='#a0afc4';ctx.fillText('DATA_NOT_AVAILABLE',20,100);return}let vals=r.series.flatMap(s=>s.values),lo=Math.min(...vals),hi=Math.max(...vals);if(hi===lo)return;let colors=['#53d8b7','#8aaeff','#ffc56b','#da98ee','#ef8585'];r.series.forEach((s,i)=>{ctx.strokeStyle=colors[i%colors.length];ctx.beginPath();s.values.forEach((v,j)=>{let x=15+j/(s.values.length-1)*(w-160),y=15+(hi-v)/(hi-lo)*210;j?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();ctx.fillStyle=colors[i%colors.length];ctx.fillText(s.symbol,w-125,20+i*25)})}catch(e){box.querySelector('p').textContent='DATA_NOT_AVAILABLE · '+e.message}}).observe($('aibody'),{childList:true});
</script></html>
